name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        node: [22, 23, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm run check

  native-state-privileged:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build and install trusted native helper and state root
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" in
            *[!0-9-]*) exit 1 ;;
          esac
          case "$RUNNER_OS" in
            Linux) trusted_chain=(/ /usr /usr/local) ;;
            macOS) trusted_chain=(/ /opt) ;;
            *) exit 1 ;;
          esac
          for ancestor in "${trusted_chain[@]}"; do
            [[ -d "$ancestor" && ! -L "$ancestor" ]]
            if [[ "$RUNNER_OS" == Linux ]]; then
              owner="$(stat -c %u "$ancestor")"
              mode="$(stat -c %a "$ancestor")"
            else
              owner="$(stat -f %u "$ancestor")"
              mode="$(stat -f %Lp "$ancestor")"
            fi
            [[ "$owner" == 0 && "$mode" =~ ^[0-7]{3,4}$ ]]
            (( (8#$mode & 8#22) == 0 ))
            [[ ! -w "$ancestor" ]]
          done
          trusted_parent="${trusted_chain[${#trusted_chain[@]}-1]}"
          native_root="$trusted_parent/agent-host-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          helper_build="$RUNNER_TEMP/anchored-private-state"
          root_group="$(id -g root)"
          npm run native:build -- "$helper_build"
          sudo install -d -o root -g "$root_group" -m 0755 "$native_root" "$native_root/bin" "$native_root/state"
          sudo install -o root -g "$root_group" -m 0555 "$helper_build" "$native_root/bin/anchored-private-state"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0700 "$native_root/state/user"
          echo "AGENT_HOST_PRIVILEGED_STATE_DIR=$native_root/state/user" >> "$GITHUB_ENV"
          echo "AGENT_HOST_PRIVILEGED_STATE_HELPER=$native_root/bin/anchored-private-state" >> "$GITHUB_ENV"
      - run: npm run test:native:privileged

  integrated-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-host
          persist-credentials: false
      - id: compatibility
        working-directory: agent-host
        run: |
          dashboard_sha="$(node -p "require('./release-compatibility.json').dashboard.commit")"
          echo "dashboard_sha=$dashboard_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: s-hiraoku/agent-host-dashboard
          ref: "${{ steps.compatibility.outputs.dashboard_sha }}"
          path: dashboard
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run check
        working-directory: dashboard
      - run: node scripts/build-release.js --dashboard-dir=../dashboard/dist --output=dist
        working-directory: agent-host
      - run: |
          set -euo pipefail
          shasum -a 256 -c checksums.txt
          archive="$(awk '/\.tar\.gz$/{print $2}' checksums.txt)"
          mkdir extracted
          tar -xzf "$archive" -C extracted
          release="$(find extracted -mindepth 1 -maxdepth 1 -type d)"
          env AGENT_HOST_INSTALL_ROOT="$RUNNER_TEMP/install" AGENT_HOST_BIN_DIR="$RUNNER_TEMP/bin" node "$release/scripts/manage-installation.js" install "$release"
          env AGENT_HOST_INSTALL_ROOT="$RUNNER_TEMP/install" AGENT_HOST_BIN_DIR="$RUNNER_TEMP/bin" node "$release/scripts/manage-installation.js" status
          "$RUNNER_TEMP/bin/agent-host" version --json
        working-directory: agent-host/dist
      - name: Cross-repository live conformance against extracted artifact
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 24)"
          mkdir -p "$RUNNER_TEMP/home"
          env HOME="$RUNNER_TEMP/home" AGENT_HOST_API_TOKEN="$token" AGENT_HOST_PORT=48777 AGENT_HOST_REFRESH_MS=60000 "$RUNNER_TEMP/bin/agent-host" demo >"$RUNNER_TEMP/agent-host-release.log" 2>&1 &
          host_pid=$!
          cleanup() {
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          if ! env AGENT_HOST_BASE_URL=http://127.0.0.1:48777 AGENT_HOST_API_TOKEN="$token" npm run test:conformance:live; then
            cat "$RUNNER_TEMP/agent-host-release.log"
            exit 1
          fi
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: agent-host-release-candidate
          path: |
            agent-host/dist/checksums.txt
            agent-host/dist/agent-host-*.tar.gz
            agent-host/dist/agent-host-*-release-manifest.json
            agent-host/dist/agent-host-*.spdx.json
          if-no-files-found: error
